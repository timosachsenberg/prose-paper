<?xml version='1.0' encoding='ISO-8859-1'?>
<PARAMETERS xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd">
  <NODE name="ProSE" description="Annotates bottom-up MS/MS spectra using ProSE.">
    <ITEM name="version" value="3.7.0-pre-HEAD-2026-11-11" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance '1' section for 'ProSE'">
      <ITEMLIST name="in" type="input-file" description="Input spectrum file(s). Multiple files are searched against the same database; the fragment index is built once and reused. An mzML file may also be given as a remote location (s3://bucket/run.mzML, http://, https:// or ftp://): it is streamed, not downloaded to disk." required="true" advanced="false" supported_formats="*.mzML,*.mzpeak,*.d,*.raw">
      </ITEMLIST>
      <ITEM name="database" value="" type="input-file" description="Input protein sequence database in FASTA format." required="true" advanced="false" supported_formats="*.fasta,*.fa,*.faa" />
      <ITEMLIST name="out" type="output-file" description="Output identification file(s), one per -in: idXML or an idparquet directory bundle (format by extension). Must have the same number of entries as -in." required="false" advanced="false" supported_formats="*.idXML,*.idparquet">
      </ITEMLIST>
      <ITEMLIST name="out_idxml" type="output-file" description="Deprecated alias of -out (same behaviour, idXML or idparquet by extension). Cannot be combined with -out." required="false" advanced="true" supported_formats="*.idXML,*.idparquet">
      </ITEMLIST>
      <ITEM name="out_qpx" value="" type="string" description="Output directory for QPX exchange format Parquet files. Writes per-input runs/&lt;basename&gt;.psm.parquet and runs/&lt;basename&gt;.pg.parquet, and quantms.psm.parquet and quantms.pg.parquet of the whole run (see also -qpx_extended): the folder is one QPX dataset (prefix quantms). The pg files are written only when protein groups were actually inferred, which needs 'FDR:protein' &gt; 0 (with decoys), or '-out_merged' with more than one input; an identification-only run produces no pg file rather than an empty one. The Parquet files of an earlier run in the folder (quantms.*.parquet, runs/*.parquet) are removed." required="false" advanced="true" tags="output dir" />
      <ITEM name="out_parquet" value="" type="string" description="Output directory for OpenMS internal format Parquet files. Writes per-input runs/&lt;basename&gt;.psm/proteins/pg/search_params.parquet, and openms.psm/proteins/pg/search_params.parquet of the whole run: the folder is one dataset (prefix openms). With several inputs and 'FDR:protein' &gt; 0 or -out_merged also merged.proteins.parquet and merged.pg.parquet (the pooled proteins). The Parquet files of an earlier run in the folder (openms.*.parquet, merged.*.parquet, runs/*.parquet) are removed." required="false" advanced="true" tags="output dir" />
      <ITEM name="out_merged" value="" type="output-file" description="Optional output of all PSMs pooled across the input files, with a protein inference across them (BasicProteinInferenceAlgorithm) and, with 'Search:FDR:protein' &gt; 0, the picked-protein FDR (see the tool documentation, 'Final results vs. intermediates'). Only useful with multiple -in files. idXML or an idparquet directory bundle (format by extension)." required="false" advanced="false" supported_formats="*.idXML,*.idparquet" />
      <ITEMLIST name="out_pin" type="output-file" description="Output Percolator input (.pin/.tsv) file(s) for external rescoring. Must have the same number of entries as -in. It holds the PSMs before the rescoring and before any FDR filter, with ProSE's own scores and all reported hits: 'Search:rescore' and 'Search:FDR:*' apply to the other outputs only." required="false" advanced="true" supported_formats="*.tsv">
      </ITEMLIST>
      <ITEM name="out_mod_analysis_dir" value="" type="string" description="Optional directory to write modification-analysis tables (delta-mass, PTM stats) when running in open-search mode. When set, per-file tables are written using each input file's basename and an additional aggregate table is written across all input files. The analysis covers the PSMs of each input that pass 'Search:FDR:PSM', before the protein FDR (the evidence for the mass shifts, also of PSMs whose proteins the protein FDR removes). Has no effect in closed-search mode." required="false" advanced="true" tags="output dir" />
      <ITEM name="summary_out" value="" type="output-file" description="Optional YAML file capturing the end-of-search report (per-file identification statistics, shared configuration/database/index facts, timing and output manifest) for pipeline ingestion. The same information is printed to the command line unless -no_summary is set." required="false" advanced="true" supported_formats="*.yaml" />
      <ITEM name="no_summary" value="false" type="bool" description="Suppress the end-of-search report printed to the command line. The -summary_out YAML file (if requested) is still written." required="false" advanced="true" />
      <ITEM name="qpx_extended" value="false" type="bool" description="With -out_qpx: add optional columns to the QPX psm view (all scores in 'additional_scores', 'spectrum_reference', 'isotope_error', 'protein_mappings'; in the per-input files also PeptDeep's predicted b/y intensities) and write the QPX mz view of the spectra of each input's PSMs (filtered peaks, see -qpx_peak_top) and the QPX run, sample and provenance views (quantms.run/sample/provenance.parquet: the inputs with their statistics, the steps of the search with their parameters); a run without protein inference gets one protein group per protein. See the tool documentation." required="false" advanced="true" />
      <ITEM name="qpx_peak_window" value="100.0" type="double" description="-qpx_extended: the m/z window of the peak filter of the mz view." required="false" advanced="true" restrictions="1.0:" />
      <ITEM name="qpx_peak_top" value="100" type="int" description="-qpx_extended: the most intense peaks kept per -qpx_peak_window (with every annotated peak); 0 keeps all peaks." required="false" advanced="true" restrictions="0:" />
      <ITEM name="keep_decoys" value="false" type="bool" description="Keep the decoy PSMs and proteins that pass the FDR thresholds in the outputs of a final result (Search:FDR:protein &gt; 0; see the tool documentation, 'Final results vs. intermediates')." required="false" advanced="true" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="Search" description="">
        <ITEM name="enzyme" value="Trypsin/P" type="string" description="The enzyme used for peptide digestion." required="false" advanced="false" restrictions="Chymotrypsin/P,CNBr,Formic_acid,Lys-C,Lys-N,Lys-C/P,PepsinA,TrypChymo,Trypsin/P,V8-DE,V8-E,leukocyte elastase,proline endopeptidase,Trypsin,glutamyl endopeptidase,Alpha-lytic protease,2-iodobenzoate,iodosobenzoate,staphylococcal protease/D,proline-endopeptidase/HKR,Glu-C+P,PepsinA + P,cyanogen-bromide,Clostripain/P,elastase-trypsin-chymotrypsin,no cleavage,unspecific cleavage,Arg-C,Arg-C/P,Asp-N,Asp-N/B,Asp-N_ambic,Chymotrypsin" />
        <ITEM name="decoys" value="auto" type="string" description="Decoy handling for target-decoy FDR. 'auto': ensure decoys are available — reuse decoys already present in the database (marker auto-detected, prefix or suffix) or generate them if none are found. Supplied decoys are reused only at 0.5 to 2 decoys per target protein: target-decoy FDR needs about one decoy per target, so a database with far fewer or more is refused (use 'generate'). 'generate': always (re)generate decoys from the target proteins (any pre-existing decoys are removed first to avoid decoy-of-decoy entries). 'ignore': search the target proteins only — any decoys present in the database are removed." required="false" advanced="false" restrictions="auto,generate,ignore" />
        <ITEM name="decoy_prefix" value="DECOY_" type="string" description="Accession prefix prepended to decoy proteins when ProSE generates them (modes 'auto' without existing decoys, and 'generate'). Pre-existing decoys in the database are detected automatically (any common marker, used as prefix or suffix) and do not require this setting." required="false" advanced="true" />
        <ITEM name="decoy_method" value="keep_termini" type="string" description="How ProSE generates decoys (decoys 'generate', or 'auto' with a database without decoys). 'reverse' (ProSEAlgorithm's default; the ProSE tool's default is 'keep_termini'): every enzymatic segment of the protein is reversed except its last residue (the last segment entirely), an initial Met stays first with peptide:clip_nterm_methionine. 'keep_termini': the construction of OpenMS DecoyDatabase (method reverse, Decoy:keepPeptideNTerm/keepPeptideCTerm true) with the search enzyme and Decoy:non_shuffle_pattern 'KRP': in every segment of a digest without missed cleavages, the first and the last residue and every K, R and P stay in place and the rest is reversed. For enzymes whose cleavage sites are fixed by these residues (Trypsin, Trypsin/P, Lys-C, Arg-C and the like) every target peptide then has a decoy with the same start, length, mass and cleavage sites: also every protein N-terminal and Met-clipped one, so that peptide:clip_nterm_methionine and protein N-terminal modifications add the same number of target and decoy candidates (except peptides that equal their decoy, e.g. made of short segments or of K, R and P only; and modifications specific to a peptide's first residue, e.g. pyro-Glu on an N-terminal Q, apply to the target and its decoy alike only where that residue is kept in place). Semi- or non-specific digestion: as 'reverse'. Other enzymes: a warning names the decoys whose cleavage sites differ from the target's. No effect on decoys taken from the database (decoys 'auto' with decoys in it). The results differ from 'reverse'." required="false" advanced="true" restrictions="reverse,keep_termini" />
        <ITEM name="decoy_parity_report" value="false" type="bool" description="Diagnostic: log the candidate counts of the fragment index per label (target, decoy) and subclass (internal, protein N-terminal with and without initial M, Met-clipped; and their protein N-terminally acetylated occurrences, none with a fixed N-terminal modification such as TMT, which leaves no room for a variable one), and a checksum of generated decoys. Output unchanged." required="false" advanced="true" />
        <ITEM name="low_memory" value="false" type="bool" description="Non-specific searches (peptide:enzyme_specificity=none; ignored otherwise): index the peptide masses, as the prefixes of one mother peptide per protein position, instead of the fragments of every peptidoform, and generate the fragments of the peptidoforms in the precursor window at query time. Finds the same candidates with a fraction of the memory (e.g. for immunopeptidomics against a human database), but takes more time per spectrum, the more the wider the precursor window." required="false" advanced="false" />
        <ITEM name="rescore" value="true" type="string" description="Rescore the PSMs of every search run (input file) in-process with Percolator (OpenMS' built-in implementation, as PercolatorAdapter uses by default) before the FDR filters: Percolator q-values become the main score (the SVM score and PEP are kept as meta values), Percolator rescores the top 'rescoring:top_hits' hits of each spectrum and only its best one per spectrum is kept, and FDR:PSM and FDR:protein are applied to the rescored PSMs. Needs decoys (see 'decoys') and at least 100 PSMs: a run without them, or for which Percolator fails, is not rescored and keeps its search engine scores, which the FDR filters then use (the ProSE tool warns). If that happens to some files of a multi-file search, the files rescored on their own keep their results, and the others get the scores of a model trained on the PSMs of those (on the scale of its training PSMs, with their PEP at the same score; q-values by target-decoy competition of each file's PSMs on that score); if Percolator can rescore no file on its own, all files are rescored together with one model. Only if that fails too, the files keep their search engine scores, and the pooled evaluation of the files (the ProSE tool's -out_merged) scores the proteins by ProSE's score 'ln(hyperscore)' of all PSMs instead of Percolator's PEP. See percolator:max_train_psms for the training PSMs. Set to 'false' to report the search engine scores. Keep it on for intermediates (FDR:protein 0) that ProteomicsLFQ finishes: it takes the PEP (meta value MS:1001493) as main score and stops for an input without PEPs." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="rescore_solver" value="newton" type="string" description="Solver of Percolator's SVMs with 'rescore' (Percolator's parameter 'solver'): 'newton' (default; explicit-Hessian Newton method with exact line search and warm starts: the same SVM optimum for a given training set as TRON, within the solver tolerance, much faster on large runs; as the earlier iterations of the cross-validation stop at a looser tolerance, they may choose slightly different training sets, so the models can differ from TRON's), 'tron' (Percolator's trust region Newton method, the solver of the percolator executable and of earlier ProSE versions) or 'lda' (Fisher's linear discriminant instead of the SVM: fastest, an approximation)." required="false" advanced="true" restrictions="newton,tron,lda" />
        <ITEM name="rescore_method" value="percolator" type="string" description="With 'rescore': 'percolator' = Percolator's PSM-level FDR (default); 'reset' = Percolator-RESET (Freestone et al., J Proteome Res 2025): half of the decoy peptides (stems = unmodified sequences, by a random coin per stem) train the model, the other half estimates the FDR, which is controlled at the peptide (stem) level: every rescored hit gets the q-value of its stem as meta value 'RESET:peptide_q_value'. The main score (q-value) stays PSM-level, but under RESET it is a heuristic (not FDR-controlled): 2 (estimating decoy PSMs + 1) / target PSMs. Experimental." required="false" advanced="true" restrictions="percolator,reset" />
        <NODE name="precursor" description="Precursor (Parent Ion) Options. mass_tolerance_lower/_upper are positive magnitudes applied as [-lower, +upper] around the precursor mass.">
          <ITEM name="mass_tolerance_lower" value="20.0" type="double" description="Lower-side precursor-mass tolerance (positive magnitude; effective window is [-lower, +upper] around the precursor). When strongly asymmetric, also review precursor:isotope_error_min." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="mass_tolerance_upper" value="20.0" type="double" description="Upper-side precursor-mass tolerance (positive magnitude)." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="mass_tolerance_unit" value="ppm" type="string" description="Unit of precursor mass tolerance." required="false" advanced="false" restrictions="ppm,Da" />
          <ITEM name="min_charge" value="2" type="int" description="Minimum precursor charge to be considered. Spectra without a precursor charge are searched with every charge of the range; spectra whose recorded charge lies outside of it are searched at that charge, or not at all with precursor:recorded_charge_outside_range 'skip'." required="false" advanced="false" restrictions="1:20" />
          <ITEM name="max_charge" value="5" type="int" description="Maximum precursor charge to be considered (see precursor:min_charge)." required="false" advanced="false" restrictions="1:20" />
          <ITEM name="recorded_charge_outside_range" value="search" type="string" description="A spectrum whose recorded precursor charge lies outside of precursor:min_charge..max_charge: 'skip' (the default, as OpenMS develop since #10713) does not search it; 'search' (the behaviour before #10713) searches it at its recorded charge, up to charge 20. Spectra without a recorded charge are searched with every charge of the range." required="false" advanced="true" restrictions="search,skip" />
          <ITEM name="isotope_error_min" value="-2" type="int" description="Minimum precursor isotope error searched, in 13C spacings (1.00336 Da) added to the observed precursor mass: -1 finds a peptide whose first 13C isotope peak was selected as the precursor. The PSM meta value 'isotope_error' reports the opposite sign by default (see report:isotope_error_convention)." required="false" advanced="false" restrictions="-5:5" />
          <ITEM name="isotope_error_max" value="1" type="int" description="Maximum precursor isotope error searched, with the sign of precursor:isotope_error_min: +1 finds a peptide whose precursor was selected one 13C spacing below its monoisotopic peak." required="false" advanced="false" restrictions="-5:5" />
        </NODE>
        <NODE name="fragment" description="Fragments (Product Ion) Options">
          <ITEM name="mass_tolerance" value="20.0" type="double" description="Fragment mass tolerance" required="false" advanced="false" />
          <ITEM name="mass_tolerance_unit" value="ppm" type="string" description="Unit of fragment m" required="false" advanced="false" restrictions="ppm,Da" />
          <ITEM name="deisotope" value="auto" type="string" description="MS2 deisotoping (single-charge deconvolution) before searching. 'auto' deisotopes only when the fragment tolerance is within the high-resolution deisotoper range (&lt;= 0.1 Da / &lt;= 100 ppm) and skips it for low-resolution (e.g. ion-trap CID) data; 'true' always deisotopes (requires a high-resolution fragment tolerance); 'false' never deisotopes." required="false" advanced="false" restrictions="auto,true,false" />
          <ITEM name="deisotope_min_peaks" value="2" type="int" description="Minimum number of peaks, the monoisotopic peak included, of an isotope envelope that MS2 deisotoping collapses into its monoisotopic peak. With 2 (Sage-like), an ion whose M+2 peak is lost in the noise loses its M+1 peak too, so the M+1 peak no longer takes a place in the per-window peak quota, and a multiply charged ion seen with two isotope peaks is converted to charge 1; in dense spectra (e.g. timsTOF) more of the two-peak multiply charged envelopes are chance pairs. 3 is the earlier behaviour." required="false" advanced="true" restrictions="2:10" />
          <ITEM name="deisotope_charge_cap" value="precursor" type="string" description="Fragment charges that MS2 deisotoping tries. 'precursor' tries charges up to the precursor charge, but at most 3 (1-3 when the precursor charge is unknown): a fragment cannot carry more charges than its precursor, so a chance peak 1/3 Th above an ion of a 2+ precursor cannot turn the ion into a '3+' envelope at a wrong m/z. This is Sage-like; Sage caps at the precursor charge without the limit of 3 and counts an unknown charge as 3. 'none' tries charges 1-3 in every spectrum (the earlier behaviour)." required="false" advanced="true" restrictions="precursor,none" />
          <ITEM name="deisotope_sum_intensity" value="true" type="string" description="Give the monoisotopic peak of each isotope envelope the summed intensity of the envelope (Sage-like). 'false' keeps the monoisotopic peak's own intensity (the earlier behaviour)." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="min_mz" value="150" type="int" description="Minimal fragment mz for database" required="false" advanced="false" restrictions="0:" />
          <ITEM name="max_mz" value="2000" type="int" description="Maximal fragment mz for database" required="false" advanced="false" restrictions="0:" />
          <ITEM name="min_ion_index" value="2" type="int" description="Ions with index less than or equal to this value are not added to the fragment index (use 0 to include all ions; 2 skips b1/b2/y1/y2). Low-index ions are often noisy and unreliable." required="false" advanced="false" restrictions="0:" />
          <ITEM name="query_spectrum" value="auto" type="string" description="Spectrum used for candidate retrieval. 'raw' queries the fragment index with all positive-intensity peaks, before deisotoping and local/top-N filtering, so that spectra whose matching fragments are not among the retained peaks still get candidates; it costs an additional peak list per spectrum and more fragment matches. 'processed' queries with the scoring peak list. 'auto' uses 'raw' for high-resolution fragments (&lt;= 0.1 Da / &lt;= 100 ppm) and 'processed' otherwise: at low resolution, the unfiltered peaks match many random fragments and crowd out the correct candidates. Scoring always uses the processed spectrum." required="false" advanced="true" restrictions="auto,raw,processed" />
          <ITEM name="min_matched_ions" value="4" type="int" description="Minimal number of matched ions to report a PSM" required="false" advanced="false" restrictions="0:1000" />
          <ITEM name="max_charge" value="2" type="int" description="max fragment charge" required="false" advanced="false" restrictions="1:10" />
        </NODE>
        <NODE name="peaks" description="">
          <ITEM name="keep_n" value="0" type="int" description="Maximum number of MS2 peaks kept per spectrum (NLargest) before scoring. 0 = auto: a resolution-aware cap (~400 for high-res, ~80 at 0.5 Da, floor 60) that avoids the spurious low-resolution fragment matching which otherwise inflates HyperScore for targets and decoys alike. Set an explicit value to override (e.g. 400 for the legacy behavior)." required="false" advanced="true" restrictions="0:" />
          <ITEM name="window_top" value="20" type="int" description="Maximum number of MS2 peaks kept per 100 Da window (WindowMower) before scoring." required="false" advanced="true" restrictions="1:" />
          <ITEM name="window_type" value="auto" type="string" description="Local peak filtering. 'auto' uses jump_full for high-resolution fragments (&lt;= 0.1 Da / &lt;= 100 ppm), preserving the strongest peaks even in a short final 100 Da window, and legacy jump filtering otherwise. 'jump' scales the last window's peak quota by its observed width; 'jump_full' keeps the full quota in every window." required="false" advanced="true" restrictions="auto,jump,jump_full" />
        </NODE>
