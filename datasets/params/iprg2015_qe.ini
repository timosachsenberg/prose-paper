        </NODE>
        <NODE name="annotate" description="Annotation Options">
          <ITEMLIST name="PSM" type="string" description="Annotations added to each PSM." required="false" advanced="false" restrictions="ALL,fragment_mz_error_median_ppm,precursor_mz_error_ppm,matched_prefix_ions_fraction,matched_suffix_ions_fraction,num_matched_peaks,matched_prefix_ions,matched_suffix_ions,longest_peptide_ion_sequence,matched_ion_current,fragment_annotation,hyperscore_zscore,ln_num_candidates,matched_ion_current_fraction,complementary_ions_fraction">
            <LISTITEM value="ALL" />
          </ITEMLIST>
          <ITEM name="self_trained_ion_priors" value="true" type="string" description="Learn per-run fragment ion likelihoods from the confident PSMs of each file and add the Percolator features of annotate:ion_prior_features to every hit. The spectra are split into two halves by scan parity. Each half trains a model on its rank-one target hits at target-decoy competition q &lt;= annotate:ion_prior_train_fdr of the native score (their reversed sequences on the same spectra are the noise model), and every hit is scored by the model of the other half, so no PSM is scored by a model that saw its spectrum or its label. Needs annotate:ion_prior_min_psms training PSMs in each half, otherwise the features are 0. Not applied to target-only searches (decoys=ignore), which get no features. Native scores and candidate selection are unchanged. Independent of annotate:PSM." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="ion_prior_model" value="rich" type="string" description="Contexts and outcomes of the ion priors. Both keep the ion series a/b, x/y, c and z apart (c and z ions are scored for electron-activated spectra, see ions:by_activation). 'rich': ion series, precursor charge, fragment charge, relative position, the residues at the cleavage site (bond before P, bond after D or E) and whether the complementary singly charged ion matched; outcome: intensity rank x mass error (|error| / tolerance below 0.25, below 0.5, up to 1). 'basic': ion series, precursor charge, fragment charge and relative position; outcome: intensity rank." required="false" advanced="true" restrictions="rich,basic" />
          <ITEM name="ion_prior_peaks" value="all" type="string" description="Peaks the ion priors rank and match. 'all': every peak after deisotoping, before the peaks:window_top and peaks:keep_n filters, so weak fragment ions count as evidence for the model without entering HyperScore. 'scored': the peaks that are scored." required="false" advanced="true" restrictions="all,scored" />
          <ITEM name="ion_prior_max_fragment_charge" value="2" type="int" description="Highest fragment charge of the ions of the ion priors; capped at the precursor charge - 1 (at least 1)." required="false" advanced="true" restrictions="1:" />
          <ITEM name="ion_prior_train_fdr" value="0.01" type="double" description="Target-decoy competition q-value threshold selecting the training PSMs of annotate:self_trained_ion_priors." required="false" advanced="true" restrictions="0.0:1.0" />
          <ITEM name="ion_prior_min_psms" value="100" type="int" description="Minimum number of training PSMs of annotate:self_trained_ion_priors in each half of the spectra; with fewer, the features are 0." required="false" advanced="true" restrictions="1:" />
          <ITEMLIST name="ion_prior_features" type="string" description="Features of annotate:self_trained_ion_priors written to every hit and listed for Percolator: ion_prior_llr (summed log-likelihood ratio of the ion outcomes, signal vs reversed noise), ion_prior_explained (share of the predicted ion presence that was observed), ion_prior_topk_observed (share of the 6 ions most likely present that were observed)." required="false" advanced="true" restrictions="ion_prior_llr,ion_prior_explained,ion_prior_topk_observed">
            <LISTITEM value="ion_prior_llr" />
            <LISTITEM value="ion_prior_explained" />
          </ITEMLIST>
          <ITEM name="local_fragment_evidence" value="true" type="string" description="Add chance_match_surprise and mass_competition_evidence annotations and Percolator features. Uses local peak density and alternative intact/neutral-loss fragment assignments. Retains an additional peak list before window/top-N filtering, increasing memory use. Does not change native scores or candidate selection. Independent of annotate:PSM." required="false" advanced="true" restrictions="true,false" />
        </NODE>
        <NODE name="peptdeep" description="PeptDeep (ONNX) prediction-based rescoring features">
          <ITEM name="enable" value="false" type="bool" description="Add PeptDeep prediction-based rescoring features (ms2_cosine, ms2_spectral_angle, ms2_pearson, ms2_frac_pred_found, rt_abs_error) to every PSM. Uses the models shipped in OpenMS' 'share/OpenMS/models' unless 'peptdeep:ms2_model'/'peptdeep:rt_model' name others. Requires an OpenMS built with ONNX support." required="false" advanced="false" />
          <ITEM name="ms2_model" value="models/peptdeep_ms2_dynamic.onnx" type="string" description="PeptDeep MS2 fragment-intensity ONNX model, used when 'peptdeep:enable' is true. A relative name is resolved against OpenMS' shared-data directory; an absolute path is used as given." required="false" advanced="false" />
          <ITEM name="rt_model" value="models/peptdeep_rt_dynamic.onnx" type="string" description="PeptDeep retention-time ONNX model. See 'peptdeep:ms2_model'." required="false" advanced="false" />
          <ITEM name="instrument" value="QE" type="string" description="Instrument class passed to the PeptDeep MS2 model. An instrument that is not in this list is best approximated by the closest one that is." required="false" advanced="false" restrictions="QE,Lumos,timsTOF,SciexTOF,ThermoTOF" />
          <ITEM name="nce" value="-1.0" type="double" description="Normalised collision energy for the PeptDeep MS2 model. Negative selects it automatically from the collision energy recorded in the spectra, refined by scoring a small grid on confident PSMs." required="false" advanced="false" />
          <ITEM name="rt_model_type" value="b_spline" type="string" description="Model mapping predicted onto observed retention time." required="false" advanced="true" restrictions="b_spline,lowess,linear" />
          <ITEM name="batch_size" value="64" type="int" description="Peptides per ONNX inference call. The calls run side by side, one per thread: small ones keep the threads evenly busy and the memory low (on iPRG2015 with 16 threads, 64 took 40% less time than 500 and 1 GB less memory)." required="false" advanced="true" restrictions="1:" />
        </NODE>
        <NODE name="peptide" description="Peptide Options">
          <ITEM name="min_size" value="7" type="int" description="Minimum size a peptide must have after digestion to be considered in the search." required="false" advanced="false" restrictions="0:" />
          <ITEM name="max_size" value="40" type="int" description="Maximum size a peptide must have after digestion to be considered in the search (0 = disabled)." required="false" advanced="false" restrictions="0:" />
          <ITEM name="missed_cleavages" value="2" type="int" description="Number of missed cleavages." required="false" advanced="false" restrictions="0:" />
          <ITEM name="clip_nterm_methionine" value="true" type="string" description="Also search protein N-terminal peptides after removal of their initial methionine. The retained-M form is still searched; length, mass and missed-cleavage limits apply to each form. Set false for the previous search space." required="false" advanced="false" restrictions="true,false" />
          <ITEM name="deduplicate" value="true" type="string" description="Index each exact peptidoform once before candidate selection. Protein mappings still list every protein occurrence. Across database chunks, count each peptide/charge/isotope hypothesis once; retaining queried keys adds memory per spectrum. With low_memory, the repeated peptidoforms among the candidates of a spectrum are dropped instead. Set false for occurrence-based legacy candidates." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="protein_mapping" value="index" type="string" description="How the hits are mapped to their proteins (peptide evidences, target_decoy, protein_references, protein hits). 'index': from the digest of the fragment index, which holds every protein occurrence of a candidate (with a protein-terminal modification: from a pass over the database for the hits' sequences); the result is that of PeptideIndexing, which runs instead wherever the index cannot reproduce it exactly (e.g. low_memory, a specificity other than full, a chunked database, symbols other than letters or long stretches of ambiguous residues in the database). 'PeptideIndexing': always search every hit in the whole database (Aho-Corasick), as before." required="false" advanced="true" restrictions="index,PeptideIndexing" />
          <ITEM name="enzyme_specificity" value="full" type="string" description="Enzyme cleavage specificity required for both peptide termini.#br#  'full' : both termini must be enzyme-specific (canonical, e.g. tryptic).#br#  'semi' : only one terminus needs to be enzyme-specific (semi-tryptic).#br#  'none' : no enzyme constraint at either terminus; every substring of length#br#           [min_size, max_size] is enumerated. Use this for immunopeptidomics#br#           (e.g. HLA peptides 8..12mers). For very large search spaces consider#br#           tightening 'peptide:min_size'/'peptide:max_size'." required="false" advanced="false" restrictions="full,semi,none" />
          <ITEM name="motif" value="" type="string" description="If set, only peptides whose unmodified sequence (one-letter codes) contains a match of this regular expression are searched, target and decoy peptides alike, e.g. 'N[^P][ST]' for N-glycosylation sequons or 'C' for cysteine-containing peptides; '^' and '$' anchor it to the peptide termini." required="false" advanced="false" />
          <ITEM name="min_mass" value="100" type="int" description="Minimal peptide mass for database" required="false" advanced="false" restrictions="0:" />
          <ITEM name="max_mass" value="9000" type="int" description="Maximal peptide mass for database" required="false" advanced="false" restrictions="0:" />
        </NODE>
        <NODE name="report" description="Reporting Options">
          <ITEM name="top_hits" value="1" type="int" description="Maximum number of top scoring hits per spectrum that are reported. With 'rescore', only the best hit per spectrum is reported after the rescoring, and the hits that Percolator rescores are set by 'rescoring:top_hits' (report:top_hits then applies to a run that is not rescored and to -out_pin). FDR:PSM &gt; 0 and the protein FDR (FDR:protein &gt; 0) also keep the best hit of each spectrum only, so values above 1 apply with 'rescore' false, FDR:PSM 0 and FDR:protein 0." required="false" advanced="false" restrictions="1:100" />
          <ITEM name="isotope_error_convention" value="observed_minus_theoretical" type="string" description="Sign of the precursor isotope error reported for each PSM (meta value 'isotope_error', in 13C spacings of 1.00336 Da). 'observed_minus_theoretical': +1 means the observed precursor lies one 13C spacing above the peptide (its first 13C isotope peak was selected), as in MS-GF+, pepXML and Sage; PercolatorInfile and PercolatorAdapter (-out_pin, -percolator_executable) remove the offset from the precursor mass difference with this sign. The search parameters of the result record it as 'isotope_error_convention'. 'theoretical_minus_observed': the opposite sign, as written by earlier ProSE versions (no record in the search parameters); with it the Percolator input doubles the offset in dm/absdm instead of removing it." required="false" advanced="true" restrictions="observed_minus_theoretical,theoretical_minus_observed" />
        </NODE>
        <NODE name="percolator" description="Percolator rescoring ('rescore')">
          <ITEM name="max_train_psms" value="500000" type="int" description="With 'rescore': the most PSMs Percolator trains a model on (0: all). Every PSM is scored, also beyond the cap. For a run with more PSMs, Percolator samples the training PSMs by spectrum (see 'rescoring:subset_mode'); for the model of the files of a multi-file search too small for a model of their own (trained on the files rescored on their own), each of these files contributes at most this many divided by the number of input files (reproducible random spectra), so that none dominates. The run log says when the training PSMs were sampled. Searches below the cap are not affected. Until all files of such a search are searched, ProSE keeps their PSMs before the rescoring for that model: all PSMs of the files too small, and of the others only their share (with 0, all PSMs of every file, also with the ProSE tool's -out_pin)." required="false" advanced="true" restrictions="0:" />
        </NODE>
        <NODE name="rescoring" description="Options of the Percolator training of the rescoring (see 'rescore')">
          <ITEM name="top_hits" value="2" type="int" description="With 'rescore': the top scoring hits per spectrum (by the search engine score) that Percolator rescores: its training and scoring rows, of which its target-decoy competition keeps the best per spectrum, which is reported. 2 (default) gives Percolator the runner-up of each spectrum as well; more hits cost time and memory. 0 = 'report:top_hits' (as earlier ProSE versions, whose Percolator rescored the reported hits). The search keeps these hits for Percolator (with -out_pin also the reported ones): a run that Percolator does not rescore (fewer than 100 PSMs, no decoy PSM, a failure) reports at most rescoring:top_hits (if above 0) of its report:top_hits hits per spectrum; with decoys 'ignore' (no rescoring) report:top_hits." required="false" advanced="true" restrictions="0:" />
          <ITEM name="subset_mode" value="out_of_fold" type="string" description="With a training cap ('percolator:max_train_psms' &gt; 0) on a run above it (Percolator's parameter 'subset_mode'): 'out_of_fold' (default) assigns every spectrum to one of Percolator's three cross-validation folds first, draws the training sample (whole spectra, at random from the entire run, seeded), trains each fold's model on the sampled spectra of the other folds only, and scores every PSM with the model of its own fold, which never saw its spectrum. 'out_of_fold_avg': the same, but the PSMs of the spectra outside the sample (which no model saw) are scored by the average of the fold models. 'in_sample' = the percolator executable's --subset-max-train: cross-validation on the sample and all PSMs scored by the average of the fold models (the sampled PSMs by two models that trained on them). 'learning_curve' (also without a cap): out-of-fold training on nested samples of 'rescoring:curve_start', twice, four times ... as many PSMs, up to 'percolator:max_train_psms' (0: 1,000,000) or the whole run but the validation spectra (the end of the random order, at most 250,000 PSMs or 20 %); each fold's model stops at the first doubling that adds less than 'rescoring:curve_min_gain' or 2 standard errors of targets at 1 % among the validation spectra of the other folds (no label of its own fold is used), and is not trained further; every PSM is scored by its fold's model. The sizes and the curve are recorded as Percolator:subset_curve." required="false" advanced="true" restrictions="out_of_fold,out_of_fold_avg,in_sample,learning_curve" />
          <ITEM name="curve_start" value="100000" type="int" description="'rescoring:subset_mode' learning_curve: PSMs of the first sample." required="false" advanced="true" restrictions="1:" />
          <ITEM name="curve_min_gain" value="2.0e-03" type="double" description="'rescoring:subset_mode' learning_curve: a fold stops at the first doubling that adds less than this fraction of validation targets." required="false" advanced="true" restrictions="0.0:" />
          <ITEM name="iterations" value="10" type="int" description="Iterations of Percolator's cross-validation training (the percolator executable's --maxiter). Fewer are faster; the results differ." required="false" advanced="true" restrictions="1:" />
          <ITEM name="tron_epsilon" value="1.0e-07" type="double" description="Stopping tolerance of the SVM solver (TRON) of Percolator's training (Percolator: 1e-7). Larger values (e.g. 1e-3) train much faster on large runs; the results differ." required="false" advanced="true" restrictions="1.0e-15:" />
          <ITEM name="warm_start" value="false" type="bool" description="Each SVM training of an iteration starts from the weights of the previous iteration instead of 0 (faster; the results differ)." required="false" advanced="true" />
          <ITEM name="single_cneg" value="false" type="bool" description="Percolator trains with one Cneg (3 x the target/decoy ratio x Cpos) instead of selecting among three by cross-validation (faster; the results differ)." required="false" advanced="true" />
          <ITEM name="use_pi0" value="true" type="string" description="Percolator's q-values and PEPs with its pi0 estimate (default) or with pi0 = 1, as the percolator executable computes them with target-decoy competition (-Y). 'false' gives slightly fewer PSMs and a lower measured false discovery proportion; the results differ. 'auto' decides as the executable (OpenMS develop's in-process default since #10721): with ProSE's target-decoy competition that is 'false'." required="false" advanced="true" restrictions="true,false,auto" />
          <ITEM name="calc_mass_feature" value="false" type="bool" description="Percolator's training uses the CalcMass column (the theoretical m/z) as a feature. 'false' (the default): as the percolator executable, which reads it as metadata (OpenMS develop since #10717); 'true': the behaviour before #10717. The results differ." required="false" advanced="true" />
          <ITEM name="fixed_enzyme_termini" value="false" type="bool" description="A protein terminus counts as an enzymatic site for the enzN/enzC features of the rescoring and of '-out_pin' (Percolator's convention). Default 'false' keeps the former features, in which a peptide at a protein N-terminus has enzN = 0 and one at a protein C-terminus that does not end in a cleavage residue has enzC = 0; the results differ. The peptide after an initial Met (the Met-clipped protein N-terminal peptide of peptide:clip_nterm_methionine) counts as N-terminal too. Experimental: tested only with decoy_method 'keep_termini'; without the Met-clip rule, with the decoys of a database of reversed proteins (which rarely start with M) enzN = 0 was left almost only to Met-clipped peptides of targets and the FDR was no longer controlled (entrapment FDP 13-24 % at 1 % q)." required="false" advanced="true" />
          <ITEM name="terminal_features" value="true" type="string" description="Two more rescoring features: 'protein_nterm' (1 if the peptide occurs at a protein N-terminus) and 'met_clipped' (1 if it occurs only as the Met-clipped protein N-terminal peptide of peptide:clip_nterm_methionine). They let the rescoring learn the different rate of correct matches of these small peptide classes. Use them only with decoys that populate both classes like the targets (decoy_method 'keep_termini'): with decoys that rarely start with M (reversed proteins, reused with decoys 'auto') they would tell targets from decoys, so they are switched off with a warning. The results differ." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="stratum_q_values" value="true" type="string" description="Also q-values per stratum (meta values 'stratum' and 'stratum_q_value'): the rescored PSMs of protein N-terminal peptides (incl. Met-clipped ones) and the others each get target-decoy competition of their own ((decoys + 1) / targets, as mokapot's grouped confidence). For a list of N-terminal peptides at an FDR, use the stratum q-value; the main score stays the pooled q-value. Needs decoys that populate the N-terminal classes like the targets (decoy_method 'keep_termini'; with reused decoys that rarely start with M it is switched off with a warning). With rescore_method 'reset' the values are computed on RESET's scores (both decoy sets count as decoys with reset:decoys 'two'), not as RESET's estimate." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="peptide_level" value="true" type="string" description="Also Percolator's peptide-level q-values (default; 'false' leaves them out), as the percolator executable reports peptides (without -U): after the target-decoy competition of the spectra, the best PSM of each peptide (modified sequence) and label competes, and q-values and PEPs are estimated on these peptides. Every rescored hit gets the values of its peptide as meta values 'percolator_peptide_q_value' and 'percolator_peptide_pep'; a list of peptides at an FDR is the target peptides with percolator_peptide_q_value at most that FDR (the distinct peptides of the PSMs at an FDR are not FDR-controlled at the peptide level). The main score stays the PSM-level q-value. Default Percolator rescoring only (not with rescore_method 'reset', which reports RESET:peptide_q_value, nor with rescore_reuse models). Independent of this parameter, every rescored hit gets ProSE's peptide-level q-value 'peptide q-value' (the name FalseDiscoveryRate writes and EntrapmentEvaluator reads), with one peptide definition for each run and for the pooled runs of a multi-file search (the ProSE tool's -out_merged): FalseDiscoveryRate::applyBasicPeptideLevel() (a peptide is an unmodified sequence, whose best PSM competes with its label) on the PSMs' Percolator PEPs, also with rescore_reuse models; not with rescore_method 'reset'." required="false" advanced="true" restrictions="true,false" />
        </NODE>
        <NODE name="reset" description="Percolator-RESET options (rescore_method 'reset')">
          <ITEM name="salt" value="" type="string" description="rescore_method 'reset': salt of the decoy coins (unsigned 64-bit integer); empty = random per run. The salt is recorded in the search parameters ('RESET:salt'). Never pick the best of several salts." required="false" advanced="true" />
          <ITEM name="learner" value="svm" type="string" description="rescore_method 'reset': 'svm' = linear SVM; 'mlp' = small MLP ensemble (experimental)." required="false" advanced="true" restrictions="svm,mlp" />
          <ITEM name="mlp_members" value="8" type="int" description="rescore_method 'reset', learner 'mlp': networks per ensemble." required="false" advanced="true" restrictions="1:" />
          <ITEM name="mlp_hidden" value="16" type="int" description="rescore_method 'reset', learner 'mlp': units of each of the two hidden layers." required="false" advanced="true" restrictions="1:" />
          <ITEM name="mlp_epochs" value="30" type="int" description="rescore_method 'reset', learner 'mlp': training epochs of the first round." required="false" advanced="true" restrictions="1:" />
          <ITEM name="mlp_warm_epochs" value="3" type="int" description="rescore_method 'reset', learner 'mlp': &gt; 0 = the networks continue from the previous round for this many epochs (warm starts); 0 = trained afresh (mlp_epochs) every round." required="false" advanced="true" restrictions="0:" />
          <ITEM name="mlp_crossfit" value="true" type="string" description="rescore_method 'reset', learner 'mlp': score each peptide by the networks that did not train on it (3 folds by sequence hash); 'false' = one final ensemble (memorizes its training decoys: fewer peptides)." required="false" advanced="true" restrictions="true,false" />
          <ITEM name="mlp_norm_min_decoys" value="1000" type="int" description="rescore_method 'reset', learner 'mlp', cross-fitted: normalize the folds' scores (as Percolator) only if every fold has at least this many training decoys (0 = always)." required="false" advanced="true" restrictions="0:" />
          <ITEM name="representative" value="model" type="string" description="rescore_method 'reset': the PSM that represents a peptide (stem): 'model' (default) = after each training round, best score under the new model (+2 % peptides on DIA; the FDR then also assumes that null targets and decoys are exchangeable over their whole PSM collections, including their sizes); 'search' = best search engine score (the paper)." required="false" advanced="true" restrictions="search,model" />
          <ITEM name="iterations" value="25" type="int" description="rescore_method 'reset': training rounds (the paper: 5; on DIA pseudo-spectra 5 rounds stop far from convergence: 82 % of the peptides of 20 rounds on HeLa)." required="false" advanced="true" restrictions="1:" />
          <ITEM name="audit" value="false" type="bool" description="rescore_method 'reset': feature-symmetry audit before training (log)." required="false" advanced="true" />
          <ITEM name="decoys" value="single" type="string" description="rescore_method 'reset': 'single' = one decoy database (default); 'two' = the two-decoy mode of Percolator-RESET: the database holds a second decoy set of the same construction (accessions starting with reset:second_decoy_prefix, also recognized as decoys by the decoy marker), the spectra are searched against targets and both decoy sets, and RESET estimates the FDR with the factors of two decoy databases (fewer peptides lost to the decoy split, less variation between salts; the search is larger)." required="false" advanced="true" restrictions="single,two" />
          <ITEM name="second_decoy_prefix" value="DECOY_X_" type="string" description="rescore_method 'reset', reset:decoys 'two': accession prefix of the proteins of the second decoy set." required="false" advanced="true" />
          <ITEM name="stem_table" value="" type="string" description="rescore_method 'reset': write the stems with their q-values (tab-separated) to this file, or, if it ends with '/' or is a directory, to &lt;dir&gt;/&lt;spectra file base name&gt;.reset_stems.tsv per run." required="false" advanced="true" />
        </NODE>
        <NODE name="rescore_reuse" description="Percolator model reuse across the files of a search ('rescore')">
          <ITEM name="mode" value="per_file" type="string" description="Which PSMs train the Percolator model of a run ('rescore'). 'per_file': the run itself, with Percolator's three-fold cross-validation. The other modes cross-fit: the spectra are split into two halves at random (by Percolator's seed), one model is trained per half on about 'rescore_reuse:max_train' PSMs, and every PSM is scored by the model of the other half, so that no PSM is scored by a model that was trained on it (5 % of the spectra of each half are not trained on: their decoys put the scores of their own half's model on one scale; they are scored by the other model). 'joint' (a multi-file search): the training PSMs are drawn from all files, the same number from each, and the files are rescored once all are searched (mokapot's joint model). 'static' (a multi-file search): they are drawn from the first 'rescore_reuse:static_files' files, and every later file is rescored with these models after its search, unless the features of its PSMs differ from those of the training PSMs by more than 'rescore_reuse:max_shift': then it is rescored as with 'per_file'. 'own': every file trains its two models on its own PSMs. In every mode the q-values and PEPs of a file come from its own target-decoy competition (Percolator's, as with 'per_file'). 'joint' and 'static' need an unchunked closed search of several files and keep all files' PSMs in memory until they are rescored; otherwise 'per_file' applies." required="false" advanced="true" restrictions="per_file,joint,static,own" />
          <ITEM name="max_train" value="250000" type="int" description="Training PSMs per model of 'rescore_reuse:mode' (0: all PSMs of the half but the calibration spectra). The spectra are drawn at random, all PSMs of a drawn spectrum together, so the number is met on average; the files share it equally (a file with fewer PSMs gives all)." required="false" advanced="true" restrictions="0:" />
          <ITEM name="static_files" value="1" type="int" description="With 'rescore_reuse:mode' static: the number of (first) input files that train the models." required="false" advanced="true" restrictions="1:" />
          <ITEM name="max_shift" value="0.5" type="double" description="With 'rescore_reuse:mode' static: the largest domain shift for which a file is rescored with the static models. The shift is max |2 AUC - 1| over the features the models use, AUC comparing the file's PSMs with the training PSMs, targets and decoys alike (0: same distribution, 1: separated)." required="false" advanced="true" restrictions="0.0:1.0" />
        </NODE>
        <NODE name="FDR" description="False Discovery Rate control (requires decoys)">
          <ITEM name="PSM" value="0.0" type="double" description="Filter PSMs based on q-value (e.g., 0.05 = 5% FDR; 0 disables the filter). Target and decoy PSMs are filtered alike by the threshold; decoys that pass are kept (no decoy-specific stripping here — decoys are removed only at protein-FDR finalization). With 'rescore' (the default), the threshold applies to the Percolator q-values, the main score of the rescored PSMs. Without rescoring ('rescore' false, or a run that Percolator did not rescore), 0 computes no q-values: every PSM keeps its search engine score ('ln(hyperscore)') as main score, e.g. as input for Percolator or a downstream FDR step. Above 0, the target-decoy q-value (see FDR:PSM_groups) replaces the main score (the search engine score is kept as meta value 'ln(hyperscore)_score') and only the best hit of each spectrum is kept. If no PSM matched a decoy, the q-value of the T PSMs is the conservative 1/T (target-decoy competition with +1), so a lower threshold reports no PSM instead of lifting the filter. Needs decoys ('decoys' auto or generate); with 'ignore', a threshold above 0 is skipped with a warning (the QPX run view of the ProSE tool's -qpx_extended records per input whether the filter was applied: 'psm_fdr_applied'). Afterwards, the proteins that no remaining PSM references are removed. The final PSM FDR with FDR:protein &gt; 0 (e.g. 0.01), a loose evidence threshold of the intermediates with FDR:protein 0 (e.g. 0.1; see there)." required="false" advanced="false" restrictions="0.0:1.0" />
          <ITEM name="PSM_groups" value="scored_charges" type="string" description="Target-decoy competitions of FDR:PSM. 'pooled' ranks all PSMs together. 'scored_charges' computes q-values separately for PSMs scored with different numbers of fragment charges (scoring:fragment_charges): HyperScore grows with the number of theoretical ions, so when multiply charged fragments are scored for precursors of charge 3 and above but not for charge 2, a pooled competition is dominated by the higher precursor charges. With singly charged fragments only (deisotoped, high-resolution spectra) there is one group, as with 'pooled'. With fragment:max_charge above 2, precursor charges of 4 and above form further groups, which accept few PSMs per run (tens), so their q-values (D/T, as FalseDiscoveryRate) are coarse. A group without decoy or without target PSMs falls back to 'pooled'." required="false" advanced="true" restrictions="scored_charges,pooled" />
          <ITEM name="protein" value="0.0" type="double" description="Picked-protein FDR threshold (e.g. 0.01 = 1 %), and the switch between the two modes of a search. Above 0, the search is the whole experiment: its proteins are inferred on the pooled PSMs of all its inputs, filtered at this protein FDR, and the PSMs filtered finally, so every output is the final result (the decoys removed, see the ProSE tool's -keep_decoys). With 0 (the default), the search is one part of a larger experiment, e.g. one shard of files searched on one compute node: every output is a per-run intermediate (PSM q-values and PEPs per run, FDR:PSM as a loose evidence threshold, decoys and the proteins the search indexed for the run's PSMs kept), to be finished downstream on all parts together (e.g. ProteomicsLFQ, or IDMerger, ProteinInference or Epifany, FalseDiscoveryRate and IDFilter). Uses the picked-protein approach (Savitski et al. 2015) which pairs target and decoy proteins by accession. The protein inference and the picked-protein FDR use the PSMs up to FDR:protein_inference_PSM, and a protein scores with the best posterior error probability of its PSMs (Percolator's, with 'rescore'; without it the best search engine score). The proteins and the protein groups (which have q-values of their own) are filtered at the threshold, and only the proteins of the groups that pass are kept. Proteins without a reported PSM (one that passes FDR:PSM) are removed afterwards, and so are the PSMs all of whose proteins failed the protein FDR. Needs decoys ('decoys' auto or generate)." required="false" advanced="false" restrictions="0.0:1.0" />
          <ITEM name="protein_inference_PSM" value="0.1" type="double" description="q-value cutoff of the PSMs that protein inference and the protein FDR (FDR:protein &gt; 0) use; FDR:PSM still filters the reported PSMs. Without the protein FDR it has no effect. The q-values are those FDR:PSM filters on (Percolator's with 'rescore', else see FDR:PSM_groups). A looser cutoff than FDR:PSM leaves more decoy proteins for the picked-protein FDR, as ProteomicsLFQ infers proteins on PSMs at a looser q-value than its PSM FDR. Values at or below FDR:PSM use the PSMs of FDR:PSM; with FDR:PSM 0 (no PSM filter) all PSMs are used." required="false" advanced="true" restrictions="0.0:1.0" />
        </NODE>
        <NODE name="scoring" description="Search/Scoring Limits">
          <ITEM name="max_candidates_per_spectrum" value="50" type="int" description="The number of initial hits for which we calculate a score" required="false" advanced="false" restrictions="1:" />
          <ITEM name="fragment_charges" value="auto" type="string" description="Fragment charges of the theoretical spectra that score each candidate. 'single' scores singly charged fragments only. 'multiple' adds charges up to min(precursor charge - 1, fragment:max_charge). 'auto' uses 'multiple' when the MS2 spectra are not deisotoped (fragment:deisotope=false, or a fragment tolerance above the deisotoper's limit of 0.1 Da / 100 ppm, as for ion-trap CID) and 'single' otherwise, because deisotoping converts fragments to charge 1." required="false" advanced="true" restrictions="auto,single,multiple" />
          <ITEM name="method" value="auto" type="string" description="Native score. 'hyperscore' is the X!Tandem HyperScore. 'mass_accuracy' weights each matched fragment's contribution to HyperScore's ion counts and intensity product by exp(-0.5 * (error / scoring:mass_error_sd)^2), with the error in ppm, so that matches near the theoretical m/z count fully and matches at the edge of the tolerance count little; exact matches score as HyperScore. The kernel is centred at 0 and suits high-resolution fragments only. 'auto' (default) uses 'mass_accuracy' for fragment tolerances in ppm within the high-resolution range (&lt;= 100 ppm) and 'hyperscore' otherwise (Da tolerances, e.g. ion-trap CID). Matching tolerances, candidates and the unweighted match annotations are unchanged. The score type stays 'ln(hyperscore)'; the search parameters record scoring:method_resolved when the weighted score is used." required="false" advanced="true" restrictions="hyperscore,mass_accuracy,auto" />
          <ITEM name="mass_error_sd" value="7.0" type="double" description="Standard deviation in ppm of the Gaussian fragment mass-error kernel of scoring:method 'mass_accuracy'. Fixed (not fitted) and independent of the matching tolerance and of calibration." required="false" advanced="true" restrictions="1.0e-06:" />
        </NODE>
        <NODE name="ions" description="Theoretical ion series toggles">
          <ITEM name="add_y_ions" value="true" type="string" description="Add peaks of y-ions to the spectrum" required="false" advanced="false" restrictions="true,false" />
          <ITEM name="add_b_ions" value="true" type="string" description="Add peaks of b-ions to the spectrum" required="false" advanced="false" restrictions="true,false" />
          <ITEM name="add_a_ions" value="false" type="bool" description="Add peaks of a-ions to the spectrum" required="false" advanced="false" />
          <ITEM name="add_c_ions" value="false" type="bool" description="Add peaks of c-ions to the spectrum" required="false" advanced="false" />
          <ITEM name="add_x_ions" value="false" type="bool" description="Add peaks of  x-ions to the spectrum" required="false" advanced="false" />
          <ITEM name="add_z_ions" value="false" type="bool" description="Add peaks of z-ions (y - NH3) to the spectrum. These are not the z+1 ions of ETD-type spectra; see ions:by_activation and ions:add_zp1_ions." required="false" advanced="false" />
          <ITEM name="add_zp1_ions" value="false" type="bool" description="Add peaks of z+1 ions (z-dot, y - NH2) to the spectrum, the main C-terminal fragments of ETD, EThcD and ETciD spectra, for all spectra. ions:by_activation adds them (with c ions) for spectra recorded as electron-activated; set this, typically with ions:add_c_ions, for ETD-type data without activation information." required="false" advanced="false" />
          <ITEM name="by_activation" value="true" type="string" description="Score spectra whose precursor was activated by electrons (ETD, ECD, EThcD or ETciD, as recorded in the input file) with c and z+1 ions in addition to the ion series above. Other spectra, and spectra without activation information, use the ion series above." required="false" advanced="false" restrictions="true,false" />
        </NODE>
        <NODE name="calibration" description="Automatic mass tolerances (two-pass search). A fast first pass on the most intense spectra measures the offset and spread of the precursor and fragment mass errors of the run; the main search uses windows derived from them, never wider than the configured tolerances.">
          <ITEM name="enabled" value="true" type="string" description="Measure the mass error of the run and search with windows derived from it: a fast calibration pass on the most intense spectra (calibration:subset_ratio), searched with at least 20 ppm (in Da: twice the configured window, up to 0.5 Da) precursor and fragment windows (the configured ones if wider) so the error is measured and not censored, takes the offset (median) and the spread (robust standard deviation, 1.4826 * MAD) of the signed mass errors of its confident PSMs; the main search then uses the fragment tolerance |median| + k sigma (calibration:sigma_factor k) within [calibration:min_fragment_tolerance, the configured tolerance], and the precursor window [median - k sigma, median + k sigma] only with calibration:precursor_sigma_factor k &gt; 0 (by default the precursor errors are measured and reported, the configured window kept): the configured tolerances are the widest windows searched. The pass takes its spectra per tenth of the run; a window that covers less than 98 % of the calibration PSMs (precursor; heavy tails or a mass offset that changes over the run) or 95 % of their matched fragment peaks (fragment) is not trusted, and the configured tolerance is kept with a warning. The fragment index is not rebuilt, only the query-time tolerances change. With too few PSMs (calibration:min_psms) the configured tolerances are used. 'false' searches with the configured tolerances as given." required="false" advanced="false" restrictions="true,false" />
          <ITEM name="subset_ratio" value="0.1" type="double" description="Fraction of spectra (by TIC, highest first) used for the calibration pass (0.0-1.0)." required="false" advanced="false" restrictions="0.01:1.0" />
          <ITEM name="min_psms" value="50" type="int" description="Minimum number of confident PSMs required for calibration. If fewer are found, calibration is skipped and the user-configured tolerances are used." required="false" advanced="false" restrictions="1:" />
          <ITEM name="sigma_factor" value="4.0" type="double" description="Half-width of the calibrated fragment tolerance in robust standard deviations (1.4826 * MAD) of the signed errors of the matched fragment peaks of the calibration PSMs: |median| + k sigma. 4 covers practically all correct matches of a normal error distribution." required="false" advanced="false" restrictions="1.0:" />
          <ITEM name="precursor_sigma_factor" value="0.0" type="double" description="Half-width of the calibrated precursor window in robust standard deviations of the precursor errors of the calibration PSMs, around their median (asymmetric about zero when the run has an offset). 0 keeps the configured precursor window and only measures and reports the errors: precursor yields are flat from 5 to 50 ppm, and a tightened precursor window cost identifications on every Orbitrap HCD set of the benchmark (heavy tails), while the fragment window gains. A value such as 4 tightens it, within calibration:min_precursor_tolerance and the configured window, when the window covers 98 % of the calibration PSMs." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="min_precursor_tolerance" value="0.0" type="double" description="Smallest calibrated precursor tolerance per side, in precursor:mass_tolerance_unit (0: 2.5 ppm or 0.005 Da). The calibrated window never exceeds the configured one." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="min_fragment_tolerance" value="0.0" type="double" description="Smallest calibrated fragment tolerance, in fragment:mass_tolerance_unit (0: 10 ppm or 0.02 Da; 5 ppm or 0.01 Da with calibration:recalibrate). The calibrated tolerance never exceeds the configured one." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="recalibrate" value="offset" type="string" description="Correct the m/z of the spectra by the mass errors the calibration pass measures, before the main search: 'offset' subtracts the median error, 'linear' a line in m/z fitted to the errors (precursor errors against the precursor m/z, fragment errors against the fragment m/z), each per retention-time chunk (calibration:recalibrate_rt_chunks) and interpolated between the chunks. The precursor m/z and the fragment peaks of the searched MS2 spectra are corrected in place (the candidate retrieval, the scoring and the PSMs' mass errors use the corrected values; a PeakMap passed to the library is corrected too); the PSMs report the observed precursor m/z and their fragment annotations the observed peak m/z. The windows are then derived from the residual errors, with a fragment floor of 5 ppm (0.01 Da) unless calibration:min_fragment_tolerance is set. The co-isolated precursors of a chimeric search, from the same survey scans, are corrected by the precursor model. 'none' measures only." required="false" advanced="false" restrictions="none,offset,linear" />
          <ITEM name="recalibrate_rt_chunks" value="10" type="int" description="Retention-time chunks of the recalibration models (calibration:recalibrate): the calibration PSMs are split in acquisition order into this many groups of equal size (fewer when a group would hold less than calibration:min_psms PSMs), one model each, interpolated between the groups' median retention times. 1: one model for the run; 10 follows an offset that changes over the run (the pass samples each tenth of it)." required="false" advanced="false" restrictions="1:" />
        </NODE>
        <NODE name="database" description="">
          <ITEM name="chunk_size" value="0" type="int" description="Split the protein database into chunks of at most this many proteins for fragment index building. 0 = disabled (load entire database at once). Enable for very large databases (e.g. MHC-II immunopeptidomics with variants) that exceed available memory. Each chunk builds its own fragment index; results are merged across chunks before post-processing. Calibration (when enabled) runs on a strided, size-bounded sample of the full decoy-augmented database — sample size is tied to chunk_size so calibration memory respects the same budget as main-search chunks. In multi-file mode (-in a.mzML b.mzML), the chunk-major path builds each chunk's fragment index once and scores all files against it before moving to the next chunk. Note that chunk_size bounds only the fragment-index memory: the chunk-major schedule holds ALL input files' preprocessed MS2 spectra in memory for the whole search, so budget for their sum as well, or split very large cohorts across separate ProSE invocations." required="false" advanced="false" restrictions="0:" />
        </NODE>
        <NODE name="chimeric" description="Search of precursors co-isolated with the selected one (chimeric spectra).">
          <ITEM name="enabled" value="false" type="bool" description="Also identify precursors co-isolated with the selected one (after the andes chimeric cascade). The survey scan of each MS2 spectrum is searched for isotope envelopes in its isolation window that fit averagine (needs centroided MS1 spectra in the input and isolation windows on the precursors). After the search, the peaks the best hit of the spectrum explains are removed, and the rest is searched for each co-isolated precursor in turn, at its m/z and charge; the best hit of each removes the peaks it explains before the next is searched. The best hit's peptide is not a hit of a co-isolated precursor, and a co-isolated precursor whose best hit repeats a PSM of the spectrum (same peptide and charge) is dropped. These PSMs get the spectrum reference of their spectrum and the PSM meta value 'chimeric_rank' 2 (the others 1). Not with database:chunk_size &gt; 0." required="false" advanced="false" />
          <ITEM name="max_coisolated" value="4" type="int" description="At most this many co-isolated precursors per spectrum, the most intense first." required="false" advanced="false" restrictions="1:" />
          <ITEM name="max_kl" value="0.3" type="double" description="Largest Kullback-Leibler divergence of an isotope envelope in the survey scan from averagine (first four isotope peaks) to accept it as a co-isolated precursor." required="false" advanced="false" restrictions="0.0:" />
          <ITEM name="top_hits" value="3" type="int" description="At most this many hits of a co-isolated precursor are reported (and at most report:top_hits). Each takes about as much memory as a hit of a spectrum." required="false" advanced="false" restrictions="1:" />
          <ITEM name="mz_tolerance" value="10.0" type="double" description="Tolerance (ppm) for the m/z of the isotope peaks in the survey scan." required="false" advanced="false" restrictions="0.0:" />
        </NODE>
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>